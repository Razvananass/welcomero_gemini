    <title>WelcomeRO</title>
    <script>
      // Apply the saved text size and night mode before the page draws, so nothing jumps or flashes.
      // Mirrors src/lib/textSize.ts and src/lib/theme.ts.
      (function () {
        try {
          var rawSize = localStorage.getItem('welcomero.textSize');
          var size = rawSize ? JSON.parse(rawSize).data : 'normal';
          if (size === 'large') document.documentElement.style.fontSize = '115%';
          if (size === 'xlarge') document.documentElement.style.fontSize = '130%';
        } catch (e) {}
        try {
          var raw = localStorage.getItem('welcomero.theme');
          var pref = raw ? JSON.parse(raw).data : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1821');
          }
        } catch (e) {}
      })();
    </script>
